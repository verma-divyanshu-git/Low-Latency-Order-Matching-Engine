name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x86_64
            os: ubuntu-24.04
            architecture: x86_64
          - name: macOS 14 arm64
            os: macos-14
            architecture: arm64

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install Ubuntu build tools
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Select newest available Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"

      - name: Show toolchain
        shell: bash
        run: |
          cmake --version
          ninja --version
          c++ --version

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  sanitizer:
    name: Ubuntu 24.04 ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            preset: asan
          - name: UBSan
            preset: ubsan
          - name: TSan
            preset: tsan

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  throughput-regression:
    name: Ubuntu 24.04 Release batch throughput regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Configure Release measurement targets
        run: cmake --preset measurement

      - name: Build batch throughput gate
        run: cmake --build --preset measurement --target order_book_throughput_gate

      - name: Run CI-only batch regression gate
        run: |
          ./build/measurement/order_book_throughput_gate \
            --samples 100000 \
            --repetitions 7 \
            --min-ops-per-second 1000000 \
            --max-relative-mad 0.25

  fuzz:
    name: Ubuntu 24.04 Clang fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Clang build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build
          clang_major="$(clang --version | grep -oE 'version [0-9]+' | grep -oE '[0-9]+')"
          sudo apt-get install --yes "libclang-rt-${clang_major}-dev"

      - name: Configure
        # Clang <=18 reports __cpp_concepts=201907L, so libstdc++ hides
        # std::expected behind its `__cpp_concepts >= 202002L` gate. Clang
        # implements concepts fully, so advertise the finished value.
        # (libc++ exposes std::expected too, but its prebuilt libFuzzer is
        # libstdc++-built and fails to link, so we stay on libstdc++.)
        run: cmake --preset fuzz -DCMAKE_CXX_FLAGS="-U__cpp_concepts -D__cpp_concepts=202002L -Wno-builtin-macro-redefined"

      - name: Build
        # The override above is global, so libstdc++ takes its concepts code
        # paths in every translation unit. GoogleTest builds at a lower C++
        # standard where `concept`/`requires` are not keywords and cannot parse
        # those headers, so build only the fuzz target. It is pure C++23 engine
        # code and is all the smoke test needs.
        run: cmake --build --preset fuzz --target order_book_fuzz

      - name: Run 10,000-execution smoke
        run: ctest --preset fuzz -L fuzz
