name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x86_64
            os: ubuntu-22.04
            architecture: x86_64
          - name: macOS 14 arm64
            os: macos-14
            architecture: arm64

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install Ubuntu build tools
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Show toolchain
        shell: bash
        run: |
          cmake --version
          ninja --version
          c++ --version

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  sanitizer:
    name: Ubuntu 22.04 ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            preset: asan
          - name: UBSan
            preset: ubsan

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: Ubuntu 22.04 Clang fuzz smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Clang build tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build

      - name: Configure
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz

      - name: Run 10,000-execution smoke
        run: ctest --preset fuzz -L fuzz
